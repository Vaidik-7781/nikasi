AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Nikasi core - 15-minute risk engine writing underpass state to DynamoDB (ap-south-1)
Resources:
  StateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: spot_id, AttributeType: S}]
      KeySchema: [{AttributeName: spot_id, KeyType: HASH}]
      TimeToLiveSpecification: {AttributeName: ttl, Enabled: true}
      SSESpecification: {SSEEnabled: true}
  RiskEngine:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.12
      Handler: nikasi.handler.lambda_handler
      CodeUri: src/
      Timeout: 60
      Environment: {Variables: {STATE_TABLE: !Ref StateTable}}
      Policies: [{DynamoDBCrudPolicy: {TableName: !Ref StateTable}}]
      Events:
        Every15:
          Type: Schedule
          Properties: {Schedule: rate(15 minutes)}
