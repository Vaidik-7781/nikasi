name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pytest cfn-lint
      - run: pytest -q
      - run: cfn-lint infra/template.yaml
      - run: node --check web/app.js && node --check web/console.js && node --check web/sw.js
